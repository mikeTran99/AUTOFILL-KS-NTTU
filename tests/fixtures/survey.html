<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Khảo sát mẫu — AutoFill regression</title><style>body{max-width:800px;margin:32px auto;padding:20px;font:16px/1.6 system-ui;color:#203047;background:#f4f6fa}fieldset,.question-item{margin:18px 0;padding:18px;background:white;border:1px solid #bdc9dc;border-radius:10px}label{display:inline-block;margin:5px}input,textarea,select{font:inherit;padding:8px}legend{font-weight:bold}[role=radio],[role=checkbox],[role=option]{display:inline-block;border:1px solid #a9b9d0;padding:8px 12px;margin:4px;cursor:pointer}[aria-checked=true],[aria-selected=true]{background:#183858;color:white}[role=listbox]{border:1px solid #a9b9d0;padding:8px}button{padding:10px}</style></head><body>
<h1>Khảo sát mẫu</h1><p>Mẫu kiểm thử nội bộ, không phải khảo sát thật của NTTU/Google/Microsoft.</p>
<form id="survey">
  <fieldset><legend>Thông tin môn học</legend><label>Tên môn học<input id="course"></label><label>Mã môn học<input id="code"></label><label>Họ tên<input id="person"></label><label>Email<input type="email" id="email"></label></fieldset>
  <fieldset><legend>NTTU: mức độ hài lòng</legend><ul class="group-cautraloi"><li><label><input name="nttu" type="radio" value="1">Hoàn toàn không đồng ý</label></li><li><label><input name="nttu" type="radio" value="2">Không đồng ý</label></li><li><label><input name="nttu" type="radio" value="3">Phân vân</label></li><li><label><input name="nttu" type="radio" value="4">Đồng ý</label></li><li><label><input name="nttu" type="radio" value="5">Hoàn toàn đồng ý</label></li></ul></fieldset>
  <div role="listitem" class="question-item"><h2 role="heading">Google: thang tuyến tính 7 mức</h2><div role="radiogroup" aria-required="true"><div role="radio" aria-checked="false" tabindex="0">1</div><div role="radio" aria-checked="false" tabindex="0">2</div><div role="radio" aria-checked="false" tabindex="0">3</div><div role="radio" aria-checked="false" tabindex="0">4</div><div role="radio" aria-checked="false" tabindex="0">5</div><div role="radio" aria-checked="false" tabindex="0">6</div><div role="radio" aria-checked="false" tabindex="0">7</div></div></div>
  <div data-automation-id="questionItem" class="question-item"><h2 data-automation-id="questionTitle">Microsoft: lựa chọn nhị phân</h2><div role="radiogroup"><div role="radio" aria-checked="false" tabindex="0">Có</div><div role="radio" aria-checked="false" tabindex="0">Không</div></div></div>
  <fieldset><legend>Chọn kỹ năng (nhiều đáp án)</legend><label><input type="checkbox" name="skills" value="a">Phân tích</label><label><input type="checkbox" name="skills" value="b">Làm việc nhóm</label><label><input type="checkbox" name="skills" value="c">Thuyết trình</label></fieldset>
  <fieldset><legend>Danh sách và nhận xét</legend><label>Khoa<select id="faculty"><option value="">Chọn</option><option value="it">CNTT</option><option value="biz">Kinh tế</option></select></label><label>Nhận xét<textarea id="comment"></textarea></label></fieldset>
  <fieldset><legend>Điểm có giới hạn</legend><label>Điểm<input type="number" min="0" max="10" step="0.5"></label><label>Thanh điểm<input type="range" min="1" max="7"></label></fieldset>
  <div role="listbox" tabindex="0" aria-label="Học kỳ" id="customList"><div role="option" aria-selected="false" data-value="1">1</div><div role="option" aria-selected="false" data-value="2">2</div></div>
  <p><button id="btnGui" type="submit">Gửi mẫu</button><span id="submitCount">0 lần gửi</span></p>
</form>
<script>
window.submitCount = 0;
document.querySelector('form').addEventListener('submit', event => { event.preventDefault(); window.submitCount++; document.querySelector('#submitCount').textContent = `${window.submitCount} lần gửi`; });
document.querySelectorAll('[role=radio]').forEach(node => node.addEventListener('click', () => node.closest('[role=radiogroup]').querySelectorAll('[role=radio]').forEach(option => option.setAttribute('aria-checked', String(option === node)))));
document.querySelectorAll('[role=option]').forEach(node => node.addEventListener('click', event => { event.stopPropagation(); node.closest('[role=listbox]').querySelectorAll('[role=option]').forEach(option => option.setAttribute('aria-selected', String(option === node))); node.closest('[role=listbox]').setAttribute('data-value', node.dataset.value); }));
</script></body></html>
