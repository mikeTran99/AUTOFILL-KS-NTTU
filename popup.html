<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --primary: #d4af37; /* Luxury Gold */
            --primary-dark: #aa771c;
            --bg-dark: #0f121b;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --shadow-3d: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        
        body {
            margin: 0;
            padding: 20px;
            width: 100%; /* Flexible width for Side Panel */
            min-width: 320px;
            background: linear-gradient(135deg, #0b0c10 0%, #1f2833 100%);
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow-x: hidden;
            box-sizing: border-box;
            min-height: 100vh; /* Fill full height in side panel */
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 25px 20px;
            box-shadow: var(--shadow-3d);
            position: relative;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 100%;
            border-radius: 24px;
            background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, transparent 100%);
            pointer-events: none;
        }

        h2 {
            margin: 0 0 25px 0;
            font-weight: 800;
            font-size: 20px;
            text-align: center;
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 10px rgba(0,0,0,0.6);
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .form-group {
            position: relative;
            transform: translateZ(10px);
        }
        
        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #c5c6c7;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .form-group input, .form-group select {
            width: 100%;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #fff;
            padding: 12px 14px;
            border-radius: 12px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 13px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.4), 0 2px 5px rgba(0,0,0,0.1);
        }
        
        /* Select specific styles */
        .form-group select {
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            background-image: url('data:image/svg+xml;utf8,<svg fill="%23d4af37" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>');
            background-repeat: no-repeat;
            background-position-x: 95%;
            background-position-y: 50%;
        }

        .form-group select option {
            background-color: var(--bg-dark);
            color: #fff;
            padding: 10px;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3), inset 0 3px 6px rgba(0,0,0,0.5);
            background: rgba(0, 0, 0, 0.6);
            transform: translateY(-2px);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #fcf6ba, #d4af37, #aa771c);
            color: #111;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-weight: 800;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3), inset 0 2px 0 rgba(255,255,255,0.8);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            transform: translateZ(20px);
        }

        .btn-submit:hover {
            transform: translateY(-4px) translateZ(20px) scale(1.02);
            box-shadow: 0 12px 25px rgba(212, 175, 55, 0.5), inset 0 2px 0 rgba(255,255,255,0.9);
        }

        .btn-submit:active {
            transform: translateY(2px) translateZ(20px) scale(0.98);
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3), inset 0 1px 0 rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>AutoFill KS NTTU</h2>
        
        <div class="form-grid">
            <div class="form-group full-width">
                <label>Tùy chọn mức độ đánh giá (5 mức)</label>
                <select id="mucDo">
                    <option value="Hoàn toàn đồng ý">Hoàn toàn đồng ý / Rất hài lòng</option>
                    <option value="Đồng ý">Đồng ý / Hài lòng</option>
                    <option value="Phân vân">Phân vân / Bình thường</option>
                    <option value="Không đồng ý">Không đồng ý / Không hài lòng</option>
                    <option value="Hoàn toàn không đồng ý">Hoàn toàn không đồng ý / Rất tệ</option>
                </select>
            </div>
            
            <div class="form-group full-width">
                <label>Tên môn học</label>
                <input type="text" id="tenMonHoc" placeholder="Nhập tên môn học...">
            </div>
            <div class="form-group full-width">
                <label>Giảng viên</label>
                <input type="text" id="giangVien" placeholder="Nhập tên giảng viên...">
            </div>
            <div class="form-group full-width">
                <label>Mã môn học</label>
                <input type="text" id="maMonHoc" placeholder="Nhập mã môn học...">
            </div>
            <div class="form-group">
                <label>Khoa</label>
                <input type="text" id="khoa" placeholder="Khoa...">
            </div>
            <div class="form-group">
                <label>Học kỳ</label>
                <input type="text" id="hocKy" placeholder="Ví dụ: 1">
            </div>
            <div class="form-group full-width">
                <label>Năm học</label>
                <input type="text" id="namHoc" placeholder="Ví dụ: 2026-2027">
            </div>
        </div>

        <button class="btn-submit" id="fillBtn">Chạy Auto Fill</button>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
