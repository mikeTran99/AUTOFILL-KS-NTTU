name: Extension checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run package
      - run: node tools/package-smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: AUTOFILL-KS-NTTU-v2.0.0
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: test-results/
          if-no-files-found: ignore
